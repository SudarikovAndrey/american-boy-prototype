  BIZ_PRICE:   [[200,300],[1000,1500],[5000,8000]],
  // ларёк как в игре: два прокачиваемых стата — Вместимость и Продажи; уровень ларька = сумма прокачек
  // точка: лесенки статов по тирам (Точка / Магазин / Супермаркет); расширение сохраняет значения и открывает новые уровни
  KIOSK: {capacity:[[8,14,22,32],[32,44,60,80],[80,110,150,200]], sales:[[2,3,4,5],[5,6,7,8],[8,9,10,12]], capUpMult:0.5, salesUpMult:0.7, feePct:0.02, feeLevelMult:1.25},
  BIZ:   {maxLevel:3, feePct:0.20, feeLevelMult:1.6, upgradeMult:0.8, landMult:3, paybackLaps:12},  // бизнес: сбор за проход, за остановку ×landMult; прокачка стоит paybackLaps кругов прибавки сбора

  PERKS: {2:'Товар на Costco на 10% дешевле',3:'Каждая твоя точка продаёт на 1 шт больше за круг',4:'Сборы с точек и бизнесов +25%',5:'Выпал дубль — продажи на старте удваиваются',

  LOANS:[ // до трёх кредитов одновременно; laps — сколько кругов твоей чистой прибыли дают, floor — минимум

  POT_PER_LAP:5,                                // копилка растёт сама за круг (×день) + все штрафы
  SCATTER:{drops:6, min:5, max:20, rollsChance:0.25, hardChance:0.08}, // 🚚 инкассатор: пачки денег по стройке (×день); часть — ходы 🎲, редко — 💎

const $=id=>document.getElementById(id);
let S=null, moving=false, floats=[], anim=null, looping=false, modalResolve=null;
let cam={x:0,y:0}, camT={x:0,y:0}, pan={x:0,y:0}, dragging=false, flyers=[], invOpen=false, reveal=null, camHold=null;

// ---------- доска ----------
function zoneOf(i){return CFG.ZONES.findIndex(z=>i>=z.from&&i<=z.to);}
function buildTiles(){
  const t=[], biz=new Set([3,8,17,23,32,37]), chance=new Set([5,15,25,35]), wh=new Set([6,10,19,24,30,34]);
  const rnd=(a,b)=>Math.round((a+Math.random()*(b-a))/10)*10;
  for(let i=0;i<40;i++){
    const z=zoneOf(i); let o={i,type:'kiosk',zone:z,owner:null,level:0,capLvl:1,salesLvl:1,goods:0,tier:1};
    if(i===0)o.type='home'; else if(wh.has(i))o.type='wh'; else if(i===20)o.type='bank'; // home — «Старт» в интерфейсе
    else if(i===15){o.type='police';o.zone=-1;} else if(i===25){o.type='pot';o.zone=-1;} else if(i===35){o.type='scatter';o.zone=-1;}
    else if(i===5){o.type='hazard';o.zone=-1;}
    else if(biz.has(i)){o.type='biz';o.price=rnd(...CFG.BIZ_PRICE[z]);}
    else{o.price=rnd(...CFG.KIOSK_PRICE[z]);const gs=CFG.GOODS.filter(g=>g.zone===z);o.good=gs[i%gs.length].id;o.base=o.good;}
    t.push(o);
  }
  return t;
}
function newGame(){
  S={day:1,rolls:CFG.ROLLS_PER_DAY,overtime:0,cash:CFG.START_CASH,pts:0,xp:0,pos:0,laps:0,tiles:buildTiles(),

  newQuest();
  log('Бруклин. В кармане $'+S.cash+', виза на 7 дней. Джонни ждёт первую поставку.');
  save(); render(); track('new_game',{});

// ---------- задания дня: лёгкое (ритм) и сложное (вызов); цели считаются от вчерашнего результата ----------
const QTEXT={sell:g=>`Продай ${g} шт`,buy:g=>`Купи ${g} ${g===1?'точку':'точки'}`,upg:g=>`Прокачай ${g} раз`,parcel:g=>`Поставка на ${g}+ очков`,earn:g=>`Заработай $${g}`};
function newQuest(){
  const L=CFG.QUEST_LADDER[Math.min(S.day,CFG.QUEST_LADDER.length)-1];
  const mk=(q,rw)=>({id:q.id,goal:q.goal,text:QTEXT[q.id](q.goal),prog:0,done:false,claimed:false,reward:rw});
  S.q=[mk(L.easy,CFG.QUEST_EASY_REWARD),mk(L.hard,L.reward)];
}
function qProg(id,n,max){if(!S.q)return;for(const q of S.q){if(q.id!==id||q.done)continue;q.prog=max?Math.max(q.prog,n):q.prog+n;if(q.prog>=q.goal){q.done=true;toast(`🎯 «${q.text}» выполнено — награда в 🎫`);}}}
const rwText=r=>r.rolls?'+'+r.rolls+' ходов':r.hard?'+💎 '+r.hard:'+$'+r.cash;
async function questClick(){
  if(!S.q)return;
  const ready=S.q.filter(q=>q.done&&!q.claimed);
  if(ready.length){for(const q of ready){const r=q.reward;if(r.rolls)S.rolls+=r.rolls;if(r.cash)S.cash+=r.cash;q.claimed=true;log(`🎯 Награда за «${q.text}»: ${rwText(r)}.`);}toast('Награда получена');save();render();return;}
  await modal(`<h2>🎯 Задания дня</h2>`+S.q.map((q,i)=>`<div class="row"><span class="n">${i?'🔥 ':''}${q.text}<small>${i?'сложное':'разогрев'} · награда ${rwText(q.reward)}</small></span><span class="v">${q.claimed?'✓':Math.min(q.prog,q.goal)+'/'+q.goal}</span></div>`).join('')+`<p>Линейка одна для всех игроков и растёт по дням. Незабранная награда сгорает в полночь.</p>`,[{t:'Ок',v:1}]);
}

async function roll(){
  if(moving||S.finished)return;
  if(S.rolls<=0)return overtimeOffer();
  S.rolls--; moving=true; pan={x:0,y:0}; hideTip(); render();
  const a=1+Math.floor(Math.random()*6), b=1+Math.floor(Math.random()*6), dbl=a===b, total=a+b;
  if(S.jail>0){ // в участке: дубль выпускает бесплатно, после attempts попыток выпускают со штрафом
    if(dbl){S.jail=0;toast(`🎲 ${a} + ${b} — дубль! Выпустили бесплатно.`);log('Дубль — вышел из участка без штрафа.');}
    else{S.jail--;
      if(S.jail>0){toast(`🎲 ${a} + ${b} — сидишь. Осталось попыток: ${S.jail}`);log(`В участке: не дубль, ход потерян. Попыток: ${S.jail}.`);}
      else{const m=pay(S.jailFine);toast(`🎲 ${a} + ${b} — отпустили, списали $${m}`);log(`Три попытки вышли. Отпустили, списав штраф $${m}.`);}
      await wait(400);moving=false;save();render();
      if(S.rolls<=0)setTimeout(()=>{if(!moving)overtimeOffer();},400);return;}
  } else {track('roll',{a,b,dbl,from:S.pos});toast(`🎲 ${a} + ${b}${dbl?' — дубль!':''}`);}
  await wait(250);
  for(let k=0;k<total;k++){
    const from=S.pos, to=(S.pos+1)%40, first=k===0, last=k===total-1;
    await step(from,to,first||last?CFG.MOVE_MS*2:CFG.MOVE_MS,first&&last?'one':first?'in':last?'out':'lin');
    S.pos=to;
    const t=S.tiles[S.pos];
    if(S.pos===0) await lapDone(dbl);
    if(t.type==='bank'&&!last&&(S.loans||[]).length&&S.cash<loanInterest()){await bankThreat();break;} // коллекторы тормозят у банка
    if((t.type==='kiosk'||t.type==='biz')&&t.owner&&unlocked(t)){
      const biz=t.type==='biz', f=fee(t)*(biz&&last?CFG.BIZ.landMult:1);
      S.cash+=f;S.stat.earned+=f;S.dstat.earned+=f;qProg('earn',f);
      fly('💵',AT.tile(t.i),AT.cash(),biz?flyN(f):1,{pulse:'sCash'});
      if(biz&&last){float(t.i,'💰 +$'+f+' касса!','#ffd54f',1.6);log(`${bizName(t)}: остановка — снял кассу $${f} (×${CFG.BIZ.landMult}).`);}
      else float(t.i,'+$'+f,biz?'#ffd54f':'#b7ad98',biz?1.15:0.8);
      render();}
    else if(!unlocked(t)&&!last){const m=CFG.STREET_PASS_PER_LEVEL*level();if(m>0){S.cash+=m;S.stat.earned+=m;S.dstat.earned+=m;float(t.i,'+$'+m,'#9aa3b8');render();}} // стройка: мелочь за проход, растёт с уровнем Джонни
  }
  await land(S.tiles[S.pos]);
  moving=false; save(); render();
  if(S.rolls<=0&&!S.finished)setTimeout(()=>{if(!moving)overtimeOffer();},400);
}
const ease={lin:p=>p,in:p=>p*p,out:p=>1-(1-p)*(1-p),one:p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2};
function step(from,to,ms,kind){if(CFG.SPEED>=100)return Promise.resolve();return new Promise(res=>{
  const a={from,to,t0:performance.now(),ms:ms/CFG.SPEED,kind,res,done:false};anim=a;kick();
  // страховка: если кадры не тикают (вкладка в фоне), шаг всё равно завершится
  setTimeout(()=>{if(anim===a&&!a.done){a.done=true;a.p=1;res();}},a.ms+60);
});}
function kick(){if(!looping){looping=true;requestAnimationFrame(loop);}}
function loop(now){
  if(anim&&!anim.done){let p=Math.min(1,(now-anim.t0)/anim.ms);anim.p=ease[anim.kind](p);if(p>=1){anim.done=true;anim.p=1;anim.res();}}
  draw();
  for(const f of flyers){f.p=Math.min(1,(now-f.t0)/f.ms);if(f.p>=1&&!f.done){f.done=true;f.onDone&&f.onDone();}}
  flyers=flyers.filter(f=>!f.done);
  if((anim&&!anim.done)||floats.length||camMoving||flyers.length)requestAnimationFrame(loop); else looping=false;
}

        S.loans=S.loans.filter(x=>x!==l);}}}

// ---------- склад: закупка по товару, раскладка по ларькам сама (сначала ларьки с большими продажами) ----------
function goodKiosks(g){return myKiosks().filter(t=>t.good===g).sort((a,b)=>sales(b)-sales(a));}
function goodCap(g){return goodKiosks(g).reduce((s,t)=>s+cap(t),0);}
function goodSales(g){return goodKiosks(g).reduce((s,t)=>s+sales(t),0);}
let lastFly={};
function addGoods(g,n){ // по кругу, начиная с самых продающих; возвращает сколько реально разложено
  const ks=goodKiosks(g);let put=0;const got=new Set();
  while(n>0){let any=false;for(const t of ks){if(n<=0)break;if(t.goods<cap(t)){t.goods++;n--;put++;any=true;got.add(t.i);}}if(!any)break;}
  const now=performance.now(); if(put&&now-(lastFly[g]||0)>160){lastFly[g]=now;fly('💵',AT.cash(),AT.card(),1);got.forEach(i=>fly(good(g).icon,AT.card(),AT.tile(i),1,{delay:120}));}
  return put;
}

// ---------- инкассатор: раскидывает деньги и неприятности по стройке ----------
async function scatter(){
  let spots=S.tiles.filter(t=>!unlocked(t)&&!t.drop&&t.i!==S.pos);
  if(spots.length<4)spots=S.tiles.filter(t=>t.i!==0&&t.i!==S.pos&&!t.drop&&(t.type==='kiosk'||t.type==='biz')&&!t.owner);
  spots.sort(()=>Math.random()-0.5);
  const c=CFG.SCATTER,sc=S.day;let money=0,n=0;
  const plan=[];
  let rollsN=0,hardN=0;
  spots.slice(0,c.drops).forEach(t=>{const r=Math.random();if(r<c.hardChance){plan.push({t,drop:{hard:1},icon:'💎'});hardN++;}else if(r<c.hardChance+c.rollsChance){plan.push({t,drop:{rolls:2},icon:'🎲'});rollsN++;}else{const m=(c.min+Math.floor(Math.random()*(c.max-c.min)))*sc;plan.push({t,drop:{cash:m},icon:'🪙'});money+=m;}n++;});
  toast(`🚚 Мешок лопнул! $${money} разлетелось по стройке`);
  await flyDrops(plan);
  log(`🚚 Инкассатор растерял мешок: $${money}${rollsN?', '+rollsN+'×🎲':''}${hardN?', '+hardN+'×💎':''} разлетелось по ${n} клеткам стройки. Забираешь, когда останавливаешься.`);render();
}
async function flyDrops(plan){
  // купюры вылетают из клетки инкассатора дугой и ложатся на клетки; drop появляется по приземлению
  const[g1,g2]=gridOf(S.pos),[x0,y0]=iso(g1,g2),now=performance.now();
  plan.forEach((pl,idx)=>{const[a,b]=gridOf(pl.t.i),[x1,y1]=iso(a,b);
    flyers.push({x0,y0:y0-TH,x1,y1:y1-TH*0.3,icon:pl.icon,t0:now+idx*90/CFG.SPEED,ms:750/CFG.SPEED,p:0,onDone:()=>{pl.t.drop=pl.drop;if(!(pl.drop.cash>0))float(pl.t.i,pl.drop.rolls?'🎲':pl.drop.hard?'💎':'⚠️','#ef5350');kick();}});});
  kick();
  await wait(750+plan.length*90+200);
  for(const f of flyers){if(!f.done){f.done=true;f.onDone&&f.onDone();}} flyers=[]; // страховка, если кадры не тикали
}
// ---------- хулиганы: раскидывают неприятности по стройке ----------

  spots.sort(()=>Math.random()-0.5);
  const sc=S.day,plan=[];

      `<div class="row"><span class="n">Очки за поставку</span><span class="v">${p}</span></div>
      ${canSlot?`<div class="row"><span class="n">Ещё одно место в контейнере<small>каждое следующее сегодня вдвое дороже · осталось ${CFG.EXTRA_SLOT.perDay-S.extraSlots}</small></span><span class="qty"><button class="sm hard" id="mSlotH" ${S.hard<hp?'disabled':''}>💎 ${hp}</button></span></div>`:''}

const cv=$('board'),cx=cv.getContext('2d');

function gridOf(i){if(i<10)return[10-i,10];if(i<20)return[0,20-i];if(i<30)return[i-20,0];return[10,i-30];}
function iso(gx,gy){return[OX+(gx-gy)*TW/2,OY+(gx+gy)*TH/2];}
function panelH(){const p=$('panel');const h=(p&&p.offsetHeight)||0;return h>20?h-40:0;} // док лежит поверх поля; часть его высоты — прозрачный градиент
function fit(){
  try{const ui=Math.max(0.78,Math.min(1,window.innerWidth/430,window.innerHeight/840));document.documentElement.style.setProperty('--ui',ui.toFixed(3));
    if(!('zoom' in document.documentElement.style)){document.documentElement.classList.add('nozoom');[['top','top center'],['panel','bottom center'],['inv','bottom left'],['tip','bottom center'],['toast','top center']].forEach(([id,o])=>{const el=$(id);if(el){el.style.transform=`scale(${ui})`;el.style.transformOrigin=o;}});}
    const ph=$('panel').getBoundingClientRect().height,th=$('top').getBoundingClientRect().height;
    document.documentElement.style.setProperty('--panelH',Math.max(80,(ph||220)-70*ui)+'px');document.documentElement.style.setProperty('--topH',(th||170)+'px');}catch(e){}
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr;cv.height=r.height*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  TW=Math.max(56,Math.min(130,r.width/CFG.ZOOM));TH=TW*0.58;OX=0;OY=0;
}
function float(i,text,color,size){const[gx,gy]=gridOf(i),[x,y]=iso(gx,gy);floats.push({x,y:y-10,text,color,t:0,size:size||1});kick();}
const LOCK_COL='#4a453d', FREE_COL='#d6ccb0';
// сумма дропа → стопка монет 1..4 (относительно разброса инкассатора за день)
function coinTier(cash){const c=CFG.SCATTER,lo=c.min*S.day,hi=c.max*S.day;const q=hi>lo?(cash-lo)/(hi-lo):1;return Math.max(1,Math.min(4,1+Math.floor(q*4)));}
function drawCoins(px,py,tier){const rx=TW*(0.085+0.012*tier),ry=rx*0.5,step=rx*0.42,n=tier;
  for(let k=0;k<n;k++){const yy=py-k*step;cx.beginPath();cx.ellipse(px,yy,rx,ry,0,0,Math.PI*2);cx.fillStyle=k===n-1?'#ffd54f':'#e2a72e';cx.fill();cx.lineWidth=Math.max(1,TW*0.012);cx.strokeStyle='#7a5a12';cx.stroke();}
  // ребро верхней монеты и блик
  const top=py-(n-1)*step;cx.beginPath();cx.ellipse(px,top,rx*0.62,ry*0.62,0,0,Math.PI*2);cx.strokeStyle='#b8860b';cx.lineWidth=Math.max(1,TW*0.01);cx.stroke();
  cx.beginPath();cx.ellipse(px-rx*0.3,top-ry*0.25,rx*0.18,ry*0.16,0,0,Math.PI*2);cx.fillStyle='#fff3c4';cx.fill();}
function tileColor(t){
  if(t.type==='home')return'#c0392b';if(t.type==='wh')return'#bfb59a';if(t.type==='bank')return'#2e7d32';if(t.type==='chance')return'#ff7043';
  if(t.type==='police')return'#546e7a';if(t.type==='pot')return'#f9a825';if(t.type==='scatter')return'#00897b';if(t.type==='hazard')return'#6d4c41';
  if(!unlocked(t))return LOCK_COL;

  return t.type==='biz'?'#8e6bd1':CFG.ZONES[t.zone].color;

function mix(a,b,p){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const c=sh=>Math.round(((A>>sh)&255)+(((B>>sh)&255)-((A>>sh)&255))*p);return'#'+[16,8,0].map(sh=>c(sh).toString(16).padStart(2,'0')).join('');}
function revealP(t){if(!reveal||t.zone!==reveal.zone)return 1;const z=CFG.ZONES[reveal.zone];return Math.max(0,Math.min(1,(Date.now()-reveal.t0-(t.i-z.from)*150)/600));}
function tileH(t){return 0;} // поле плоское; уровень показывают звёзды

  $('bTaxi').classList.toggle('blink',taxiOn&&!moving&&myKiosks().length>0&&myKiosks().reduce((a,t)=>a+t.goods,0)===0&&S.hard>=taxiPrice()&&S.rolls>0);
  $('bShop').innerHTML=`<span>🛒${S.tips.shopOpened||!shopOn?'':'<i class="dot"></i>'}</span><small>${shopOn?'Магазин':'позже'}</small>`;$('bShip').className='dk '+(canShip?'ok':'');
  {const nm=nextMilestone();$('bHub').textContent=`${ready?'🎁 ':'🎫 '}${S.pts}/${nm?nm.pts:CFG.MILESTONES.slice(-1)[0].pts} · #${lbPlace()}`;}$('bHub').className='chip'+(ready?' okc':'');
  $('tShip').textContent=S.parcelSent?'ушла':canShip?'собрать':'нет товара';
  const ks=myKiosks();
  {const tot=ks.reduce((a,t)=>a+t.goods,0),totc=ks.reduce((a,t)=>a+cap(t),0);$('inv').hidden=!ks.length;$('invList').hidden=!invOpen;
   $('invBtn').innerHTML=`<em>📦</em><i><b style="width:${totc?Math.round(tot/totc*100):0}%"></b></i><small>${invOpen?'▾':tot+'/'+totc}</small>`;
   $('invList').innerHTML=CFG.GOODS.filter(g=>ks.some(t=>t.good===g.id)).map(g=>{const c=ks.filter(t=>t.good===g.id).reduce((s,t)=>s+cap(t),0);return`<span class="${S.trend===g.id?'trend':''}">${g.icon} ${stock(g.id)}/${c}</span>`;}).join('');}
  $('bRoll').disabled=moving||S.finished;$('bRoll').className='dice'+(S.jail>0?' jail':'');
  $('bRoll').querySelector('.die').textContent=S.rolls>0?'🎲':'⏳';renderRolls();
  $('bTaxi').disabled=moving||S.finished||S.jail>0||S.hard<taxiPrice()||!taxiOn;
  $('bHub').disabled=moving;$('bShop').disabled=moving||!shopOn;$('bShip').disabled=moving||S.finished||!canShip;$('bJohnny').disabled=moving;
  // панель текущей клетки: пока стоишь на точке, бизнесе, Costco или банке — окно можно открыть заново
  const ct=S.tiles[S.pos], tb=$('tilebar'); let tbText=null;
  if(!moving&&!S.finished&&unlocked(ct)){
    if(ct.type==='kiosk')tbText=`${pointName(ct)} · ${good(ct.good).icon} ${good(ct.good).name}${ct.owner?' '+ct.goods+'/'+cap(ct):' · $'+ct.price}`;
    else if(ct.type==='biz')tbText=`🏢 ${bizName(ct)} · ${ct.owner?'ур. '+ct.level:'$'+ct.price}`;
    else if(ct.type==='wh')tbText='🏬 Costco · закупка';
    else if(ct.type==='bank'&&S.day>=CFG.BANK_DAY)tbText='🏦 Банк'+((S.loans||[]).length?' · долг $'+S.loans.reduce((a,l)=>a+l.principal,0):'');
  }
  tb.hidden=!tbText; if(tbText)$('tbText').textContent=tbText;
  draw();
}
let pd=null, pinch=null;
cv.addEventListener('wheel',e=>{e.preventDefault();CFG.ZOOM=Math.max(CFG.ZOOM_MIN,Math.min(CFG.ZOOM_MAX,CFG.ZOOM*(e.deltaY>0?1.1:0.9)));fit();draw();},{passive:false});
cv.addEventListener('touchstart',e=>{if(e.touches.length===2){pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}},{passive:true});
cv.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);CFG.ZOOM=Math.max(CFG.ZOOM_MIN,Math.min(CFG.ZOOM_MAX,CFG.ZOOM*pinch/d));pinch=d;fit();draw();e.preventDefault();}},{passive:false});
cv.addEventListener('touchend',()=>{pinch=null;});
cv.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y};dragging=false;});
cv.addEventListener('pointermove',e=>{if(!pd)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y;if(Math.hypot(dx,dy)>6)dragging=true;if(dragging){pan={x:pd.px+dx,y:pd.py+dy};draw();}});
['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,()=>{pd=null;}));
cv.addEventListener('click',e=>{
  if(dragging){dragging=false;return;}
  const r=cv.getBoundingClientRect(),sx=e.clientX-r.left-(r.width/2-cam.x+pan.x),sy=e.clientY-r.top-((r.height-panelH())/2-cam.y+pan.y);
  const gx=Math.round((sx/(TW/2)+sy/(TH/2))/2-0.5),gy=Math.round((sy/(TH/2)-sx/(TW/2))/2-0.5);
  const t=S.tiles.find(t=>{const[a,b]=gridOf(t.i);return a===gx&&b===gy;});if(!t)return;
  if(moving||S.finished){return;}
  if(t.type==='home')return toast('🏁 Старт. При проходе здесь продаётся товар с точек.');
  if(t.type==='wh')return toast('🏬 Costco. Закупка, когда останавливаешься на клетке. Или такси.');
  if(t.type==='bank'){if(S.day>=CFG.BANK_DAY)bank(true);else toast(`🏦 Банк откроется в день ${CFG.BANK_DAY}.`);return;}
  if(t.type==='hazard')return toast('🌪 Хулиганы: раскидывают неприятности по стройке. Срабатывают при остановке.');
  if(t.type==='police')return toast('🚔 Полиция: штраф (половина прибыли за круг, не больше 20% наличных) или 3 попытки на дубль.');
  if(t.type==='pot')return toast(`🎰 Копилка: $${S.pot}. Растёт сама и от всех штрафов, забирает тот, кто остановится.`);
  if(t.type==='scatter')return toast('🚚 Инкассатор: раскидывает по стройке деньги, ходы и иногда кристалл. Забираешь при остановке.');
  if(!unlocked(t)){lockedCard(t);return;}
  // как в игре: тап по своей точке открывает её окно; чужую — только посмотреть
  if(t.owner){t.type==='biz'?bizWindow(t):kioskWindow(t);}
  else toast(`${t.type==='biz'?'🏢 '+bizName(t):pointName(t)+' · '+good(t.good).icon+' '+good(t.good).name} · $${t.price} — купить можно, остановившись на клетке.`);
});
$('tip').onclick=hideTip;$('modal').addEventListener('click',e=>{if(e.target===$('modal')&&!modalSticky)closeModal();});$('toast').onclick=()=>{clearTimeout(toastT);$('toast').style.opacity=0;$('toast').style.pointerEvents='none';};$('bHub').onclick=()=>{if(!moving)eventHub();};$('sTimer').onclick=()=>{if(!moving)eventHub();};[0,1].forEach(i=>{$('q'+i).onclick=()=>{if(moving)return;const q=S.q[i];if(q&&q.done&&!q.claimed){const r=q.reward;if(r.rolls){fly('🎲',AT.el('q'+i),AT.dice(),3);S.rolls+=r.rolls;}if(r.cash){fly('💵',AT.el('q'+i),AT.cash(),flyN(r.cash),{pulse:'sCash'});S.cash+=r.cash;}q.claimed=true;track('quest_claim',{id:q.id,goal:q.goal,reward:r});toast('Награда получена');save();render();}else eventHub();};});
$('bJohnnyTop').onclick=()=>{if(!moving)eventHub();};$('bJohnny').onclick=()=>{if(!moving)eventHub();}; /* аватар и кнопка дока открывают ивентовое окно; карточка Джонни — из него */ $('bShip').onclick=()=>{if(!moving)shipClick();};$('tilebar').onclick=()=>{if(moving)return;const t=S.tiles[S.pos];if(t.type==='kiosk')kioskWindow(t);else if(t.type==='biz')bizWindow(t);else if(t.type==='wh')shop();else if(t.type==='bank')bank();};$('bShop').onclick=()=>{if(!moving){S.tips.shopOpened=true;shopHard();}};
$('bRoll').onclick=roll;$('bTaxi').onclick=taxi;$('bSettings').onclick=settings;$('invBtn').onclick=()=>{invOpen=!invOpen;render();};
window.addEventListener('resize',()=>{fit();draw();if(!$('tip').hidden)positionTip();if(!$('modal').hidden)fitCard();});
if(window.ResizeObserver)new ResizeObserver(()=>{fit();draw();}).observe(cv);
if(!load())newGame();else if(S.finished)newGame();else if(!S.player)setTimeout(()=>askName(),50);
S.sessions=(S.sessions||0)+1;track('session_start',{sessions:S.sessions});
fit();{const[g1,g2]=gridOf(S.pos);const[x,y]=iso(g1,g2);cam={x,y:y-TH*0.4};}render();
</script>
